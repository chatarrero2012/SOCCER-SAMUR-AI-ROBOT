behaviors:
  SoccerAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256          
      buffer_size: 10240       
      learning_rate: 0.0003
      beta: 0.002              # Entropía balanceada para consolidar el conocimiento lineal antes de abrir la muestra
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: True          # Vital para balancear YOLO con los vectores de velocidad física relativos
      hidden_units: 256        
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000         
    time_horizon: 128
    summary_freq: 1000