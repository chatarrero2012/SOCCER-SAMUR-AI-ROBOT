behaviors:
  SoccerAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.002              # <-- BAJADO un poco (evita que camine errático y busque más precisión)
      epsilon: 0.15            # <-- Reducido (fuerza actualizaciones de política más conservadoras/estables)
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: True          # ¡Crucial para que balancee las distancias del mapa con el YOLO del rival!
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000         # Subimos a 10M de pasos ya que el entorno con NPC es más complejo
    time_horizon: 128
    summary_freq: 20000